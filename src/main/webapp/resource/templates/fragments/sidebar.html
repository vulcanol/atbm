<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(activePage)">

    <!-- Logo -->
    <div class="sidebar-logo">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm9 14H6V10h12v10zm-6-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            </svg>
        </div>
        <div class="logo-name">Ký<span>Số</span>PDF</div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <div class="nav-section-title">Tổng quan</div>

        <a href="/dashboard" class="nav-link"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            <span class="nav-dot"></span>
            Bảng điều khiển
        </a>

        <div class="nav-section-title" style="margin-top:8px;">Chức năng</div>

        <a href="/keys" class="nav-link"
           th:classappend="${activePage == 'keys'} ? ' active' : ''">
            <span class="nav-dot"></span>
            Quản lý khoá RSA
        </a>

        <a href="/documents" class="nav-link"
           th:classappend="${activePage == 'documents'} ? ' active' : ''">
            <span class="nav-dot"></span>
            Tài liệu PDF
        </a>

        <a href="/sign" class="nav-link"
           th:classappend="${activePage == 'sign'} ? ' active' : ''">
            <span class="nav-dot"></span>
            Ký số tài liệu
        </a>

        <a href="/sign/verify" class="nav-link"
           th:classappend="${activePage == 'verify'} ? ' active' : ''">
            <span class="nav-dot"></span>
            Xác minh chữ ký
        </a>
    </nav>

    <!-- User info + logout -->
    <div class="sidebar-footer">
        <div class="user-card">
            <div class="user-avatar" th:text="${#strings.substring(userName, 0, 1)}">U</div>
            <div>
                <div class="user-name" th:text="${userName}">Người dùng</div>
                <div class="user-role">Tài khoản</div>
            </div>
        </div>
        <a href="/logout" class="logout-link">
            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            Đăng xuất
        </a>
    </div>
</aside>
</body>
</html>
